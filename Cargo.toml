[package]
name = "notepadppp"
version = "0.1.0"
edition = "2024"
description = "A fast, native text editor for programmers — built from scratch in Rust"
license = "MIT"

[dependencies]
ropey = "1.6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"
arboard = "3"
regex = "1"
walkdir = "2"
glob-match = "0.2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
pulldown-cmark = "0.12"
open = "5"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
iced = { version = "0.13", features = ["tokio", "advanced", "svg"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
