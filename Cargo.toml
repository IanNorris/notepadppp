[package]
name = "notepadppp"
version = "0.1.0"
edition = "2024"
description = "A fast, native text editor for programmers — built from scratch in Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["file", "image"] }
ropey = "1.6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"
arboard = "3"
regex = "1"
walkdir = "2"
glob-match = "0.2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
pulldown-cmark = "0.12"
open = "5"
base64 = "0.22"

[features]
default = []
native-win32 = []

[build-dependencies]
cc = "1"
glob = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_System_Com",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
